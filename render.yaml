services:
  - type: web
    name: san-chung-khoan-trial
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REQUIRE_DATABASE_URL
        value: "true"
      - key: COOKIE_SECURE
        value: "true"
      - key: TRIAL_MODE
        value: "true"
      - key: INITIAL_OWNER_USERNAME
        sync: false
      - key: INITIAL_OWNER_PASSWORD
        sync: false
